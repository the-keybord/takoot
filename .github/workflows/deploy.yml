name: CI/CD Auto Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 🏗️ Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: takoot:test

  deploy-webhook:
    name: 🚀 Trigger Coolify / Webhook Auto-Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📡 Trigger Webhook (if COOLIFY_WEBHOOK secret exists)
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Sending deploy webhook trigger..."
            curl -X POST "$WEBHOOK_URL"
            echo "Deploy webhook sent successfully!"
          else
            echo "Notice: COOLIFY_WEBHOOK secret is not set in GitHub repository secrets."
            echo "If using Coolify, add your deploy webhook URL as a repository secret named 'COOLIFY_WEBHOOK'."
          fi
